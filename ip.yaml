name: soc-linux
version: 0.1.0
spec: '0.1'
identity:
  slug: soc-linux-tapeout
  display_name: Single core SoC with memory
  summary: A core, memory and the interrupt controllers, assembled from the catalogue.
  category: soc
  maturity: planned
bus: apb4
deps:
  hwcore: ^0.1
  amba: ^0.1
  cache: ^0.1
instances:
- name: cpu
  of: hart
  with:
    mul: true
    smode: true
- name: l1i
  of: cache
  with:
    lines: 8
    wpl: 4
    stats: true
  addr: 268484608
- name: l1d
  of: cache
  with:
    lines: 8
    wpl: 4
    stats: true
  addr: 268488704
- name: mem
  of: sram
  with:
    words: 1024
  addr: 2147483648
- name: uart0
  of: uart
  with:
    fifoDepth: 8
    parity: false
    flowctrl: false
  addr: 268439552
- name: clint
  of: aclint
  with:
    harts: 1
    ssip: true
  addr: 33554432
- name: plic0
  of: plic
  with:
    sources: 8
    contexts: 2
  addr: 201326592
connect:
- to: cpu.irq.irq
  desc: 平台的三根中断线：软件中断与计时器来自 clint，外部中断来自 plic
  args:
  - clint.msip[0] == 1
  - clint.mtip[0] == 1
  - plic0.eip[0] == 1
pipe:
- manager: cpu.imem
  target: l1i.up
  desc: 取指口先过一级缓存，缓存的下游口才上总线
- manager: cpu.dmem
  target: l1d.up
  desc: 访存口同理。I 侧 D 侧各一个，与计划里「两个 Server 接 cache」同形
